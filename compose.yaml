services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file: .env
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, app_database_password, graph_database_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/00-rental.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [sh, -c, 'exec redis-server --save "" --appendonly no --requirepass "$$(cat /run/secrets/redis_password)"']
    secrets: [redis_password]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY_FILE: ${LANGSMITH_API_KEY_FILE:-/run/secrets/langsmith_api_key}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-yol-rental-assistant}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_HIDE_INPUTS: ${LANGSMITH_HIDE_INPUTS:-true}
      LANGSMITH_HIDE_OUTPUTS: ${LANGSMITH_HIDE_OUTPUTS:-true}
    secrets: [postgres_password, app_database_password, graph_database_password, redis_password, openai_api_key, quote_signing_key, langsmith_api_key]
    volumes:
      - ./data/assets:/data/assets
      - ./data/catalog:/data/catalog:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health/ready")']
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: ./frontend
    environment:
      INTERNAL_API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: '1'
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
secrets:
  postgres_password: {file: ./.secrets/postgres_password}
  app_database_password: {file: ./.secrets/app_database_password}
  graph_database_password: {file: ./.secrets/graph_database_password}
  redis_password: {file: ./.secrets/redis_password}
  openai_api_key: {file: ./.secrets/openai_api_key}
  langsmith_api_key: {file: ./.secrets/langsmith_api_key}
  quote_signing_key: {file: ./.secrets/quote_signing_key}
volumes:
  postgres_data:
